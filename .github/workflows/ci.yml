name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: griipbuddy
          POSTGRES_PASSWORD: griipbuddy
          POSTGRES_DB: griipbuddy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U griipbuddy"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://griipbuddy:griipbuddy@localhost:5432/griipbuddy_test?schema=public
      DATABASE_URL: postgresql://griipbuddy:griipbuddy@localhost:5432/griipbuddy_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - name: Migrations apply cleanly from scratch
        run: npx prisma migrate deploy
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Docker image builds
        run: docker build -t griipbuddy-api:ci .
